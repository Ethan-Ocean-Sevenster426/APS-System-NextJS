<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Food Safety Agency - Login</title>

    <!-- Favicon - Food Safety Agency Logo -->
    <link rel="icon" type="image/png" href="{% static 'img/Food safetyagencylogo.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'img/Food safetyagencylogo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/Food safetyagencylogo.png' %}">

    <!-- Preconnect to Font Awesome CDN for faster loading -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></noscript>

    <link rel="stylesheet" href="{% static 'login/css/login.css' %}?v=20260212">
</head>
<body style="background-image: url({% static 'img/food_safety_background.jpg' %}?v=2); background-repeat: no-repeat; background-position: center center;">
    <div class="container">
        <div class="logo">
                        <img src="{% static 'img/Food safetyagencylogo.png' %}" alt="Food Safety Agency Logo">
                    </div>

        <div class="header">
            <h1>Food Safety Agency (Pty) Ltd</h1>
            <h2>Secure Login Portal</h2>
                </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fas fa-lock"></i>
                    Sign In
                    </div>
                </div>

<!-- Display error message if authentication fails -->
            <div class="error-message" id="error-message" style="display: none;">
    <i class="fas fa-exclamation-circle"></i>
    <span id="error-text"></span>
</div>

<form method="post" action="{% url 'login' %}" autocomplete="off" id="login-form">
    {% csrf_token %}

    <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
                        <i class="fas fa-user input-group-text"></i>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required onblur="this.value=this.value.trim()">
        </div>
    </div>

    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
                        <i class="fas fa-lock input-group-text"></i>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
            </button>
        </div>
    </div>

    <div style="text-align: right; margin-bottom: 1rem;">
        <a href="{% url 'forgot_password' %}" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.15s ease;">
            Forgot Password?
        </a>
    </div>

    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <button type="submit" class="btn" id="login-button">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
    </button>

            </form>
        </div>

    </div>

    <script src="{% static 'login/js/login.js' %}?v=20260212"></script>
</body>
</html>
