<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired - Food Safety Agency</title>
    <link rel="icon" type="image/png" href="{% static 'img/Food safetyagencylogo.png' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("{% static 'img/food_safety_background.jpg' %}?v=2") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 48px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
        }

        .icon {
            width: 72px;
            height: 72px;
            background: #fef2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon svg {
            width: 36px;
            height: 36px;
            color: #dc2626;
        }

        h1 {
            font-size: 1.5rem;
            color: #1f2937;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background: #007890;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #005a6b;
        }

        .logo {
            margin-bottom: 8px;
        }

        .logo img {
            height: 48px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="{% static 'img/Food safetyagencylogo.png' %}" alt="Food Safety Agency">
        </div>

        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9.303 3.376a12 12 0 11-15.94-15.94 12 12 0 0115.94 15.94zm-1.458 8.49a10.5 10.5 0 11-14.924-14.924 10.5 10.5 0 0114.924 14.924zM12 15v.01" />
            </svg>
        </div>

        <h1>Session Expired</h1>
        <p>Your session has timed out or changed. Please refresh the page and try your action again.</p>

        <a href="{% url 'login' %}" class="btn">Back to Login</a>
    </div>
</body>
</html>
